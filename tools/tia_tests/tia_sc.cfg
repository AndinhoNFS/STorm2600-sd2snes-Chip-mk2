# ld65 configuration: one 4 KB bank of a Superchip cartridge at $F000.  The first 256 bytes ($F000-$F0FF) belong to the
# 128-byte RAM (write port $1000-$107F, read port $1080-$10FF), so the code starts at $F100.
MEMORY {
    ROM: start = $F000, size = $1000, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    CODE:    load = ROM, type = ro, start = $F100;
    SWITCH:  load = ROM, type = ro, start = $F200;
    BACK:    load = ROM, type = ro, start = $F300;
    VECTORS: load = ROM, type = ro, start = $FFFC;
}
